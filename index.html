<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>หน้าหลัก - การสร้างแชทบอท</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/assets/css/base.css">
  <link rel="stylesheet" href="/src/assets/css/layout.css">
  <link rel="stylesheet" href="/src/assets/css/components.css">
  <link rel="stylesheet" href="/src/assets/css/animations.css">
  <style>
    .dashboard-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 30px; }
    .user-info { display: flex; align-items: center; gap: 16px; }
    .avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--g1); display: grid; place-items: center; font-size: 1.8rem; border: 2px solid var(--border); box-shadow: 0 4px 12px rgba(124,107,240,0.3); }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 20px; }
    .menu-card { display: block; text-decoration: none; color: inherit; border: 1px solid var(--border2); border-radius: var(--radius); padding: 24px; background: var(--card); transition: var(--t); position: relative; overflow: hidden; }
    .menu-card:hover { transform: translateY(-5px); border-color: var(--pr); background: var(--card-hover); box-shadow: var(--shadow); }
    .menu-card::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 4px; background: var(--g1); border-radius: 4px 0 0 4px; opacity: 0; transition: var(--t); }
    .menu-card:hover::before { opacity: 1; }
    .menu-icon { font-size: 2.5rem; margin-bottom: 12px; display: inline-block; transition: var(--t); }
    .menu-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
    .menu-desc { font-size: 0.85rem; color: var(--tx2); }
    .status-badge { position: absolute; top: 20px; right: 20px; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 100px; }
    .status-done { background: rgba(6,214,160,0.15); color: var(--acc); border: 1px solid rgba(6,214,160,0.3); }
    .status-pending { background: rgba(255,255,255,0.08); color: var(--tx2); border: 1px solid var(--border2); }
  </style>
</head>
<body>
  <div class="bg-grad"></div>
  <div class="toast-wrap" id="toastWrap"></div>

  <header class="site-header" style="padding: 30px 24px 20px;">
    <div class="inner">
      <h1>Chatbot<span class="grad-text">.Edu</span></h1>
      <p class="sub">ระบบบทเรียนออนไลน์วิชาการสร้างแชทบอท</p>
    </div>
  </header>

  <main class="page">
    <div class="dashboard-header card card-glow">
      <div class="user-info">
        <div class="avatar">👨‍🎓</div>
        <div>
          <div style="font-size: 0.85rem; color: var(--tx2); font-weight: 600;">ยินดีต้อนรับเข้าสู่บทเรียน</div>
          <div style="font-size: 1.4rem; font-weight: 800; font-family: 'Space Grotesk', sans-serif;">แดชบอร์ดการเรียนรู้</div>
        </div>
      </div>
    </div>

    <h2 class="sec-title" style="margin-top: 30px;">เส้นทางการเรียนรู้</h2>
    
    <div class="menu-grid" id="menuGrid">
      <!-- Generated by JS -->
    </div>
  </main>

  <button class="theme-toggle" id="themeToggle">🌙</button>

  <script type="module" src="/src/assets/js/utils.js"></script>
  <script type="module" src="/src/assets/js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.Nav.renderTopNav('home');
      window.Nav.protectPage('home');
      window.Utils.initTheme();
      const themeBtn = document.getElementById('themeToggle');
      if(themeBtn) themeBtn.addEventListener('click', window.Utils.toggleTheme);
      
      renderMenu();
    });

    function renderMenu() {
      const progress = window.Utils.Storage.get('cb_progress') || {};
      
      const menus = [
        { id: 'pre', icon: '📝', title: 'แบบทดสอบก่อนเรียน', desc: 'วัดความรู้พื้นฐานก่อนเริ่มเรียน (10 ข้อ)', link: '/quiz?type=pre', done: progress.preTest !== null && progress.preTest !== undefined },
        { id: 'lesson', icon: '📚', title: 'บทเรียน & แฟลชการ์ด', desc: 'เรียนรู้ทฤษฎีและการออกแบบแชทบอท', link: '/lesson', done: progress.lessons && Object.keys(progress.lessons).length >= 6 },
        { id: 'worksheet', icon: '📋', title: 'ใบงานปฏิบัติ', desc: 'ออกแบบและสร้างแชทบอท (3 ใบงาน)', link: '/worksheet', done: progress.worksheets && Object.keys(progress.worksheets).length >= 3 },
        { id: 'game', icon: '🎮', title: 'เกมทบทวนความรู้', desc: 'สนุกไปกับเกม 6 ด่าน', link: '/game', done: progress.games && Object.keys(progress.games).length >= 3 },
        { id: 'post', icon: '✅', title: 'แบบทดสอบหลังเรียน', desc: 'วัดผลสัมฤทธิ์หลังเรียน (10 ข้อ)', link: '/quiz?type=post', done: progress.postTest !== null && progress.postTest !== undefined }
      ];

      const html = menus.map(m => `
        <a href="${m.link}" class="menu-card" ${m.isSpecial ? 'style="border-color: var(--pr); background: rgba(124,107,240,0.05);"' : ''}>
          ${!m.isSpecial ? `<div class="status-badge ${m.done ? 'status-done' : 'status-pending'}">${m.done ? '✓ เสร็จแล้ว' : 'รอเรียน'}</div>` : ''}
          <div class="menu-icon">${m.icon}</div>
          <div class="menu-title">${m.title}</div>
          <div class="menu-desc">${m.desc}</div>
        </a>
      `).join('');
      
      document.getElementById('menuGrid').innerHTML = html;
    }
  </script>
</body>
</html>
