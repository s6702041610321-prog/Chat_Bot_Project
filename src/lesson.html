<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>บทเรียน - การสร้างแชทบอท</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/assets/css/base.css">
  <link rel="stylesheet" href="/src/assets/css/layout.css">
  <link rel="stylesheet" href="/src/assets/css/components.css">
  <link rel="stylesheet" href="/src/assets/css/animations.css">
  <style>
    .nav-top { position: relative; z-index: 100; background: rgba(5,8,21,0.85); backdrop-filter: var(--blur); padding: 16px 24px; border-bottom: 1px solid var(--border2); display: flex; align-items: center; justify-content: space-between; }
    [data-theme="light"] .nav-top { background: rgba(240,242,255,0.9); }
    
    .lesson-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .lesson-card { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); padding: 24px; position: relative; overflow: hidden; cursor: pointer; transition: var(--t); }
    .lesson-card:hover { border-color: var(--pr); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(124,107,240,0.15); }
    .lesson-card.read { border-color: rgba(6,214,160,0.4); background: rgba(6,214,160,0.05); }
    .lesson-card.read::after { content: '✅ อ่านแล้ว'; position: absolute; top: 16px; right: 16px; font-size: 0.75rem; color: var(--acc); font-weight: 700; background: rgba(6,214,160,0.15); padding: 4px 10px; border-radius: 100px; }
    .lesson-num { font-size: 3rem; font-family: 'Space Grotesk', sans-serif; font-weight: 800; color: var(--border2); position: absolute; right: -10px; bottom: -20px; opacity: 0.5; transition: var(--t); }
    .lesson-card:hover .lesson-num { color: var(--pr2); opacity: 0.2; transform: scale(1.1); }
    .lesson-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; color: var(--tx); width: 80%; }
    .lesson-desc { font-size: 0.9rem; color: var(--tx2); line-height: 1.5; margin-bottom: 16px; }
    
    .lesson-content { display: none; padding: 30px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border2); margin-top: 20px; animation: pageIn 0.4s ease; }
    .lesson-content.active { display: block; }
    .lesson-content h3 { color: var(--pr2); font-size: 1.5rem; margin-bottom: 16px; }
    .lesson-content p { line-height: 1.6; color: var(--tx); margin-bottom: 16px; }
    
    .fc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-top: 30px; }
    .fc-card { background: transparent; perspective: 1000px; height: 120px; cursor: pointer; }
    .fc-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
    .fc-card.flipped .fc-inner { transform: rotateY(180deg); }
    .fc-front, .fc-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 16px; border-radius: var(--radius-sm); border: 1px solid var(--border2); }
    .fc-front { background: var(--card); color: var(--tx); font-weight: 700; font-size: 1.1rem; }
    .fc-back { background: linear-gradient(135deg, #7c6bf0, #a78bfa); color: #fff; transform: rotateY(180deg); font-size: 0.9rem; font-weight: 500; }
  </style>
</head>
<body>
  <div class="bg-grad"></div>
  <div class="toast-wrap" id="toastWrap"></div>

  <div class="nav-top">
    <a href="/" class="btn btn-ghost" style="padding: 6px 12px;">← กลับ</a>
    <div class="nav-title">📚 บทเรียน & แฟลชการ์ด</div>
    <div class="pb-inner" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: transparent;">
      <div class="pb-fill" id="lessonProg" style="width: 0%;"></div>
    </div>
  </div>

  <main class="page" style="padding-top: 20px;">
    
    <div class="card card-glow">
      <h2 class="sec-title">ขั้นตอนการสร้างแชทบอท (6 ขั้นตอน)</h2>
      <p class="sec-sub">คลิกอ่านให้ครบทุกขั้นตอนเพื่อปลดล็อคการเล่นเกมและการสอบหลังเรียน</p>
    </div>

    <div class="lesson-grid" id="lessonGrid">
      <!-- Generated by JS -->
    </div>

    <div id="lessonContentArea"></div>

    <h2 class="sec-title" style="margin-top: 50px;">🃏 ทบทวนคำศัพท์ (Flashcards)</h2>
    <p class="sec-sub">คลิกที่การ์ดเพื่อดูความหมายของคำศัพท์</p>
    <div class="fc-grid" id="fcGrid">
      <!-- Generated by JS -->
    </div>

  </main>

  <button class="theme-toggle" id="themeToggle">🌙</button>

  <script src="/src/assets/js/utils.js"></script>
  <script src="/src/assets/js/nav.js"></script>
  <script>
    const LESSONS = [
      { 
        id: 1, 
        title: '1. กำหนดเป้าหมาย (Goal Setting)', 
        desc: 'บอทนี้สร้างมาเพื่อใคร และแก้ปัญหาอะไร?', 
        content: `การสร้างบอทที่ดีต้องเริ่มจากการกำหนดเป้าหมายให้ชัดเจน เพราะแชทบอทแต่ละประเภทมีหน้าที่ต่างกัน:
          <ul style="margin-top:10px; margin-left:20px; line-height:1.8;">
            <li><b>Customer Service:</b> เน้นตอบคำถามที่พบบ่อย (FAQ) ช่วยลดภาระแอดมิน</li>
            <li><b>E-commerce:</b> เน้นปิดการขาย รับออเดอร์ แนะนำสินค้า</li>
            <li><b>Lead Generation:</b> เน้นเก็บข้อมูลลูกค้า เช่น เบอร์โทร อีเมล เพื่อให้เซลส์ติดต่อกลับ</li>
          </ul>
          <div style="margin-top:10px;">นอกจากนี้ต้องกำหนด <b>Persona (บุคลิกภาพ)</b> ของบอทด้วย เช่น จะให้บอทพูดจาเป็นทางการ (สวัสดีครับ/ค่ะ) หรือพูดจาเป็นกันเอง (หวัดดีจ้า) เพื่อให้เข้ากับภาพลักษณ์ของแบรนด์</div>`
      },
      { 
        id: 2, 
        title: '2. วิเคราะห์ผู้ใช้ (User Analysis)', 
        desc: 'ทำความเข้าใจกลุ่มเป้าหมาย', 
        content: `การรู้จักผู้ใช้ (User) จะช่วยให้เราออกแบบบทสนทนาได้ตรงใจที่สุด เราควรวิเคราะห์ในเรื่อง:
          <ul style="margin-top:10px; margin-left:20px; line-height:1.8;">
            <li><b>คำศัพท์ที่ใช้:</b> วัยรุ่นอาจใช้คำสแลง ผู้ใหญ่อาจใช้คำทางการ (เช่น บัญชี vs แบงก์)</li>
            <li><b>คำถามยอดฮิต:</b> รวบรวมข้อมูลจากแชทเก่าๆ ว่าลูกค้ามักจะถามเรื่องอะไรมากที่สุด (เช่น ขอเลขบัญชี, ส่งฟรีไหม)</li>
            <li><b>พฤติกรรมการพิมพ์:</b> บางคนชอบกดปุ่มเมนู บางคนชอบพิมพ์ประโยคยาวๆ หรือบางคนชอบพิมพ์สั้นๆ ห้วนๆ</li>
          </ul>
          <div style="margin-top:10px;">ยิ่งเราคาดเดาความต้องการได้แม่นยำ บอทก็จะยิ่งฉลาดและตอบโต้ได้ถูกใจผู้ใช้มากขึ้น</div>`
      },
      { 
        id: 3, 
        title: '3. ออกแบบ Conversation Flow', 
        desc: 'วาดแผนผังการสนทนา', 
        content: `ก่อนจะไปสร้างบอทในโปรแกรม เราควร "วาด" แผนผังการทำงานออกมาก่อน โดยมักใช้เครื่องมืออย่าง Flowchart หรือ Tree Diagram:
          <ul style="margin-top:10px; margin-left:20px; line-height:1.8;">
            <li><b>Happy Path:</b> เส้นทางที่ผู้ใช้ทำตามขั้นตอนที่เราวางไว้อย่างสมบูรณ์ (เช่น ถามราคา -> เลือกสินค้า -> จ่ายเงิน)</li>
            <li><b>Edge Case:</b> กรณีที่ผู้ใช้พิมพ์นอกเรื่อง หรือบอทไม่เข้าใจ ซึ่งเราต้องออกแบบ <b>Fallback Message</b> (ข้อความรองรับ) ที่ดี เช่น <i>"ขออภัยค่ะ น้องบอทยังไม่เข้าใจ ต้องการให้แอดมินช่วยดูให้ไหมคะ?"</i> พร้อมมีปุ่มให้กด</li>
          </ul>
          <div style="margin-top:10px; padding:10px; background:rgba(124,107,240,0.1); border-left:3px solid var(--pr);">💡 <b>Tip:</b> ไม่ควรปล่อยให้บอทตอบแค่ "ไม่เข้าใจ" ซ้ำๆ เพราะผู้ใช้จะรู้สึกหงุดหงิด ควรมอบทางเลือก (Quick Replies) เสมอ</div>`
      },
      { 
        id: 4, 
        title: '4. เลือกแพลตฟอร์ม (Platform Selection)', 
        desc: 'หาเครื่องมือที่เหมาะสม', 
        content: `ปัจจุบันมีเครื่องมือสำหรับสร้างแชทบอทมากมาย ซึ่งแต่ละตัวมีจุดเด่นต่างกัน:
          <ul style="margin-top:10px; margin-left:20px; line-height:1.8;">
            <li><b>Dialogflow (Google):</b> โดดเด่นเรื่อง AI (NLP) รองรับภาษาไทยได้ดีเยี่ยม เข้าใจประโยคที่ซับซ้อนได้</li>
            <li><b>LINE Official Account:</b> ใช้งานง่ายมาก มีฟีเจอร์พื้นฐานครบ (Auto-response, Rich Menu) เหมาะกับร้านค้าทั่วไปในไทย</li>
            <li><b>Botpress / Chatfuel / ManyChat:</b> เป็นแบบลากวาง (Visual Builder) ใช้งานง่าย เหมาะกับการทำ Marketing และ Broadcast</li>
          </ul>
          <div style="margin-top:10px;">การเลือกแพลตฟอร์มควรดูจาก "ช่องทาง" ที่ลูกค้าเราอยู่ (LINE, Facebook, Website) และ "งบประมาณ" ที่เรามี</div>`
      },
      { 
        id: 5, 
        title: '5. สร้างและตั้งค่า (Development)', 
        desc: 'ลงมือสร้างจริงบนระบบ', 
        content: `ขั้นตอนนี้คือการนำ Flow ที่วาดไว้มาใส่ในแพลตฟอร์ม โดยมีหัวใจสำคัญ 4 อย่างที่ต้องรู้จัก:
          <ul style="margin-top:10px; margin-left:20px; line-height:1.8;">
            <li><b>Intent (เจตนา):</b> สิ่งที่ผู้ใช้ต้องการสื่อ เช่น "อยากทราบราคา", "ร้านอยู่ไหน"</li>
            <li><b>Entity (ข้อมูลย่อย):</b> คำเฉพาะเจาะจงที่แทรกอยู่ในประโยค เช่น "พิซซ่าถาด<span style='color:var(--acc)'>ใหญ่</span>", "จองโต๊ะ<span style='color:var(--acc)'>พรุ่งนี้</span>"</li>
            <li><b>Context (บริบท):</b> ความจำของบอท เพื่อให้คุยต่อเนื่องได้ เช่น ผู้ใช้ถาม "ลดได้ไหม" (บอทต้องจำได้ว่าก่อนหน้านี้กำลังคุยเรื่องสินค้าอะไรอยู่)</li>
            <li><b>Response (การตอบกลับ):</b> ข้อความ, รูปภาพ, หรือปุ่มที่บอทจะส่งกลับไปหาผู้ใช้</li>
          </ul>`
      },
      { 
        id: 6, 
        title: '6. ทดสอบและปรับปรุง (Testing & Tuning)', 
        desc: 'นำไปให้คนอื่นลองใช้', 
        content: `แชทบอทไม่มีวันสมบูรณ์แบบตั้งแต่วันแรก! การทดสอบจึงสำคัญมาก:
          <ul style="margin-top:10px; margin-left:20px; line-height:1.8;">
            <li><b>Alpha/Beta Testing:</b> ลองให้เพื่อน หรือทีมงานเข้ามาคุยกับบอท เพื่อหาบั๊กหรือคำถามที่บอทตอบไม่ได้</li>
            <li><b>Monitor Logs:</b> เมื่อปล่อยใช้งานจริง (Go Live) ต้องหมั่นเข้ามาอ่านประวัติการแชท (Logs) เสมอ</li>
            <li><b>Training (การสอนบอท):</b> ถ้ารู้ว่าผู้ใช้มักจะพิมพ์คำว่า "ตังค์" แทนคำว่า "เงิน" แล้วบอทไม่เข้าใจ เราก็แค่จับคำว่า "ตังค์" ไปสอนเพิ่ม (Train) ในระบบ เพื่อให้บอทฉลาดขึ้นในอนาคต</li>
          </ul>
          <div style="margin-top:10px;">สรุป: แชทบอทที่ดี คือแชทบอทที่ได้รับการดูแลและอัปเดตความรู้อย่างสม่ำเสมอครับ!</div>`
      }
    ];

    const FLASHCARDS = [
      { q: 'Chatbot', a: 'โปรแกรมคอมพิวเตอร์ที่จำลองการสนทนากับมนุษย์' },
      { q: 'Intent', a: 'ความตั้งใจหรือจุดประสงค์ในประโยคของผู้ใช้' },
      { q: 'Entity', a: 'คำหรือข้อมูลเฉพาะที่ดึงออกมาจากประโยค (เช่น เวลา, จำนวน)' },
      { q: 'Fallback', a: 'การตอบกลับเมื่อบอทไม่เข้าใจสิ่งที่ผู้ใช้พูด' },
      { q: 'Persona', a: 'บุคลิกภาพหรือคาแรคเตอร์ของแชทบอท' },
      { q: 'Context', a: 'บริบทหรือความจำในการสนทนาต่อเนื่อง' },
      { q: 'NLP / NLU', a: 'ระบบประมวลผลและทำความเข้าใจภาษาธรรมชาติ' },
      { q: 'Flowchart', a: 'แผนผังแสดงลำดับขั้นตอนการทำงาน/การสนทนา' },
      { q: 'Dialogflow', a: 'แพลตฟอร์มสร้างบอทของ Google' },
      { q: 'Training', a: 'การสอนบอทให้เข้าใจประโยคหลากหลายรูปแบบ' },
      { q: 'Greeting', a: 'ข้อความทักทายแรกสุดของบอท' },
      { q: 'Quick Reply', a: 'ปุ่มทางเลือกด่วนให้ผู้ใช้กดแทนการพิมพ์' }
    ];

    let progObj = {};

    document.addEventListener('DOMContentLoaded', () => {
      window.Nav.renderTopNav('lesson');
      window.Nav.protectPage('lesson');
      window.Utils.initTheme();
      const themeBtn = document.getElementById('themeToggle');
      if(themeBtn) themeBtn.addEventListener('click', window.Utils.toggleTheme);
      
      const p = window.Utils.Storage.get('cb_progress') || {};
      progObj = p.lessons || {};
      
      renderLessons();
      renderFlashcards();
      updateProg();
    });

    function renderLessons() {
      const grid = document.getElementById('lessonGrid');
      grid.innerHTML = LESSONS.map(l => {
        const isRead = !!progObj[l.id];
        return `
          <div class="lesson-card ${isRead ? 'read' : ''}" onclick="openLesson(${l.id})">
            <div class="lesson-title">${l.title}</div>
            <div class="lesson-desc">${l.desc}</div>
            <div class="lesson-num">${l.id}</div>
          </div>
        `;
      }).join('');
    }

    function openLesson(id) {
      const l = LESSONS.find(x => x.id === id);
      if(!l) return;
      
      const area = document.getElementById('lessonContentArea');
      area.innerHTML = `
        <div class="lesson-content active">
          <h3>${l.title}</h3>
          <p>${l.content}</p>
          <div style="margin-top:20px;">
            <button class="btn btn-primary" onclick="markRead(${id})">✅ อ่านเข้าใจแล้ว</button>
          </div>
        </div>
      `;
      area.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function markRead(id) {
      progObj[id] = true;
      let p = window.Utils.Storage.get('cb_progress') || {};
      p.lessons = progObj;
      window.Utils.Storage.set('cb_progress', p);
      window.Utils.syncToGoogleSheet('บทเรียน');
      
      document.getElementById('lessonContentArea').innerHTML = '';
      window.Utils.showToast('บันทึกการอ่านแล้ว', 'success');
      
      renderLessons();
      updateProg();
    }

    function updateProg() {
      const readCount = Object.keys(progObj).length;
      const pct = (readCount / LESSONS.length) * 100;
      document.getElementById('lessonProg').style.width = pct + '%';
      
      if(readCount === LESSONS.length && pct === 100) {
        setTimeout(() => window.Utils.confetti(), 500);
      }
    }

    function renderFlashcards() {
      const grid = document.getElementById('fcGrid');
      grid.innerHTML = FLASHCARDS.map(f => `
        <div class="fc-card" onclick="this.classList.toggle('flipped')">
          <div class="fc-inner">
            <div class="fc-front">${f.q}</div>
            <div class="fc-back">${f.a}</div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
