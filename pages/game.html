<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>เกม RPG - การสร้างแชทบอท</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/assets/css/base.css">
  <link rel="stylesheet" href="/src/assets/css/layout.css">
  <link rel="stylesheet" href="/src/assets/css/components.css">
  <style>
    /* ซ่อน Scrollbar เวลาเล่นเกม */
    body { overflow-y: scroll; }
    
    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 500px;
      margin: 0 auto;
      background: #0f172a;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border2);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #1e293b; /* สีพื้นหลังฉาก */
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: 0.2s;
    }
    .color-btn.selected {
      border-color: #fff;
      transform: scale(1.2);
    }
    
    .dialogue-box {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--pr);
      z-index: 20;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: slideUp 0.3s ease;
    }
    
    .npc-name {
      font-weight: 800;
      color: var(--pr2);
      margin-bottom: 8px;
      font-size: 1.1rem;
    }
    
    .npc-text {
      color: #fff;
      margin-bottom: 16px;
      font-size: 1rem;
      line-height: 1.6;
    }
    
    .choice-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border2);
      padding: 10px 16px;
      border-radius: 8px;
      color: #fff;
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }
    .choice-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--pr);
    }
  </style>
</head>
<body>
  <div class="bg-grad"></div>
  <div class="toast-wrap" id="toastWrap"></div>

  <main class="page" style="padding-top: 20px;">
    
    <div class="card card-glow" style="margin-bottom: 20px; padding: 20px;">
      <h2 class="sec-title">🎮 AI Village (RPG Prototype)</h2>
      <p class="sec-sub" style="margin-bottom:0;">เดินสำรวจเมือง พูดคุยกับชาวบ้าน และช่วยพวกเขาตั้งค่าแชทบอทให้ถูกต้อง!</p>
    </div>

    <!-- พื้นที่แสดงเกม -->
    <div id="gameContainer">
      
      <!-- หน้าสร้างตัวละคร -->
      <div id="setupScreen" class="overlay">
        <h2 style="font-size: 2rem; margin-bottom: 10px; color: #fff;">สร้างตัวละครของคุณ</h2>
        
        <div style="margin: 20px 0; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px solid var(--border2);">
          <!-- พรีวิวตัวละคร -->
          <canvas id="previewCanvas" width="100" height="100" style="margin-bottom: 20px;"></canvas>
          
          <div style="margin-bottom: 16px;">
            <p style="margin-bottom: 8px; font-weight: 600; color: #94a3b8;">สีผิว</p>
            <div style="display: flex; gap: 10px; justify-content: center;" id="skinColors">
              <div class="color-btn selected" style="background: #fde047;" onclick="setSkin('#fde047', this)"></div>
              <div class="color-btn" style="background: #fdba74;" onclick="setSkin('#fdba74', this)"></div>
              <div class="color-btn" style="background: #d1d5db;" onclick="setSkin('#d1d5db', this)"></div>
            </div>
          </div>
          
          <div>
            <p style="margin-bottom: 8px; font-weight: 600; color: #94a3b8;">สีเสื้อ</p>
            <div style="display: flex; gap: 10px; justify-content: center;" id="shirtColors">
              <div class="color-btn selected" style="background: #3b82f6;" onclick="setShirt('#3b82f6', this)"></div>
              <div class="color-btn" style="background: #ef4444;" onclick="setShirt('#ef4444', this)"></div>
              <div class="color-btn" style="background: #10b981;" onclick="setShirt('#10b981', this)"></div>
              <div class="color-btn" style="background: #8b5cf6;" onclick="setShirt('#8b5cf6', this)"></div>
            </div>
          </div>
        </div>
        
        <button class="btn btn-primary" onclick="startGame()" style="padding: 12px 30px; font-size: 1.1rem;">เข้าสู่เมือง AI 🚀</button>
      </div>

      <!-- กล่องสนทนา -->
      <div id="dialogueBox" class="dialogue-box">
        <div class="npc-name" id="npcName">ชื่อ NPC</div>
        <div class="npc-text" id="npcText">ข้อความทักทาย</div>
        <div id="choicesContainer">
          <!-- ปุ่มคำตอบจะถูกสร้างที่นี่ -->
        </div>
      </div>

      <!-- แคนวาสหลัก -->
      <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

  </main>

  <script type="module" src="/src/assets/js/utils.js"></script>
  <script type="module" src="/src/assets/js/nav.js"></script>
  <script>
    // --- ตัวแปรหลักของเกม ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // ตั้งค่าตัวละครเริ่มต้น
    let player = {
      x: 400, y: 350,
      radius: 14,
      speed: 4,
      skinColor: '#fde047',
      shirtColor: '#3b82f6',
      facing: 'down'
    };

    let gameState = 'setup'; // 'setup', 'playing', 'dialogue'
    let keys = {};
    let lastRenderTime = 0;

    // NPC Data
    const npcs = [
      {
        x: 200, y: 150, radius: 14, skinColor: '#fca5a5', shirtColor: '#8b5cf6',
        name: '🤖 ลุงสมหมาย (เจ้าของร้านข้าว)',
        text: 'สวัสดีวิศวกรน้อย! แชทบอทสั่งอาหารของลุงมันรวนน่ะ ลูกค้าพิมพ์มาว่า "ร้านเปิดกี่โมงครับ" ลุงควรตั้งค่า Intent (เจตนา) ให้ประโยคนี้ว่าอะไรดี?',
        choices: [
          { text: 'A. Intent: สั่งซื้อสินค้า', correct: false, reply: 'เอ่อ... ลุงว่ามันไม่ใช่การสั่งของนะ' },
          { text: 'B. Intent: สอบถามเวลาทำการ', correct: true, reply: 'โอ้! ใช่เลย! บอทลุงตอบได้แล้ว ขอบใจมากไอ้หนู!' },
          { text: 'C. Intent: ขอพิกัดร้าน', correct: false, reply: 'เขาไม่ได้ถามทางนะลุงว่า...' }
        ],
        completed: false
      },
      {
        x: 600, y: 250, radius: 14, skinColor: '#fdba74', shirtColor: '#10b981',
        name: '👧 พี่สมศรี (แอดมินเพจ)',
        text: 'นี่น้อง! พี่กำลังปวดหัวเลย ลูกค้าชอบพิมพ์คำว่า "ตังค์" แทนคำว่า "เงิน" แล้วบอทพี่ก็งงเป็นไก่ตาแตก พี่ต้องแก้ปัญหาด้วยวิธีไหนดี?',
        choices: [
          { text: 'A. ปล่อยไปเลย ให้ลูกค้าพิมพ์คำว่าเงินเอง', correct: false, reply: 'แบบนั้นลูกค้าด่าพี่ตายเลยนะ!' },
          { text: 'B. จับคำว่า "ตังค์" ไปสอน (Train) เพิ่มในระบบ', correct: true, reply: 'จริงด้วย! ถ้าเราสอนบอทเพิ่ม มันก็จะฉลาดขึ้น ขอบใจจ้า!' },
          { text: 'C. ลบบอททิ้งแล้วตอบเอง', correct: false, reply: 'ถ้าตอบเองทัน พี่คงไม่จ้างน้องมาซ่อมบอทหรอกย่ะ!' }
        ],
        completed: false
      }
    ];

    // แผนที่จำลอง
    const obstacles = [
      { x: 150, y: 100, w: 100, h: 40, color: '#334155' }, // โต๊ะลุง
      { x: 550, y: 200, w: 100, h: 40, color: '#334155' }, // โต๊ะสมศรี
      { x: 350, y: 200, w: 100, h: 100, color: '#475569' } // น้ำพุกลางเมือง
    ];

    let currentNPC = null;

    // --- เริ่มต้นระบบ ---
    document.addEventListener('DOMContentLoaded', () => {
      window.Nav.renderTopNav('game');
      window.Nav.protectPage('game');
      window.Utils.initTheme();
      drawPreview();
    });

    // --- ระบบเลือกตัวละคร ---
    function setSkin(color, el) {
      player.skinColor = color;
      document.querySelectorAll('#skinColors .color-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
      drawPreview();
    }
    function setShirt(color, el) {
      player.shirtColor = color;
      document.querySelectorAll('#shirtColors .color-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
      drawPreview();
    }

    function drawPreview() {
      const pc = document.getElementById('previewCanvas');
      const pctx = pc.getContext('2d');
      pctx.clearRect(0, 0, 100, 100);
      drawCharacter(pctx, 50, 50, 20, player.skinColor, player.shirtColor);
    }

    // ฟังก์ชันวาดตัวละคร (ใช้กับทั้ง Preview และตอนเล่น)
    function drawCharacter(context, x, y, r, skin, shirt) {
      // วาดตัว (เสื้อ)
      context.fillStyle = shirt;
      context.beginPath();
      context.arc(x, y + r*0.8, r*1.2, Math.PI, 0); // ครึ่งวงกลม
      context.fill();
      
      // วาดหัว (ผิว)
      context.fillStyle = skin;
      context.beginPath();
      context.arc(x, y - r*0.5, r, 0, Math.PI*2);
      context.fill();

      // วาดเงาเล็กๆ ใต้ตัว
      context.fillStyle = 'rgba(0,0,0,0.3)';
      context.beginPath();
      context.ellipse(x, y + r*1.2, r*1.5, r*0.4, 0, 0, Math.PI*2);
      context.fill();
    }

    function startGame() {
      document.getElementById('setupScreen').style.display = 'none';
      gameState = 'playing';
      requestAnimationFrame(gameLoop);
      
      // ส่งข้อมูลเข้า Sheet ว่าเริ่มเล่นเกม
      if(window.Utils.syncToGoogleSheet) window.Utils.syncToGoogleSheet('มินิเกม (RPG เริ่มเล่น)');
    }

    // --- การควบคุม (Controls) ---
    window.addEventListener('keydown', e => { keys[e.key] = true; });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    // ปุ่ม Spacebar สำหรับคุย
    window.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter') {
        if (gameState === 'playing' && currentNPC) {
          startDialogue(currentNPC);
        } else if (gameState === 'dialogue') {
          // ถ้ากำลังคุยอยู่ อาจจะให้กดเพื่อข้ามได้ (ยังไม่ทำในเวอร์ชันต้นแบบ)
        }
      }
    });

    // --- Game Loop ---
    function gameLoop(timestamp) {
      if (gameState !== 'playing') {
        if(gameState === 'dialogue') draw(); // คงภาพไว้ตอนคุย
        requestAnimationFrame(gameLoop);
        return;
      }

      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function update() {
      let dx = 0;
      let dy = 0;

      if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= player.speed;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += player.speed;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= player.speed;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += player.speed;

      // ระบบชนขอบจอ
      if (player.x + dx > player.radius && player.x + dx < canvas.width - player.radius) player.x += dx;
      if (player.y + dy > player.radius && player.y + dy < canvas.height - player.radius) player.y += dy;

      // ระบบเช็คระยะห่างกับ NPC
      currentNPC = null;
      for (let npc of npcs) {
        let dist = Math.hypot(player.x - npc.x, player.y - npc.y);
        if (dist < 60) {
          currentNPC = npc;
        }
      }
    }

    function draw() {
      // ล้างจอและวาดพื้นหลัง
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // วาดลายตารางบนพื้น
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 2;
      for(let i = 0; i < canvas.width; i+=50) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
      }
      for(let i = 0; i < canvas.height; i+=50) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // วาดสิ่งกีดขวาง (โต๊ะ, น้ำพุ)
      for(let obs of obstacles) {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      }

      // วาด NPC
      for(let npc of npcs) {
        drawCharacter(ctx, npc.x, npc.y, npc.radius, npc.skinColor, npc.shirtColor);
        
        // ถ้า NPC ตัวนี้เป็นตัวที่อยู่ใกล้ ให้ขึ้นไอคอนแจ้งเตือน
        if (npc === currentNPC) {
          ctx.fillStyle = '#fff';
          ctx.font = '14px Inter';
          ctx.textAlign = 'center';
          ctx.fillText(npc.completed ? '💬 คุยแล้ว' : '[SPACE] เพื่อคุย', npc.x, npc.y - 30);
        }
      }

      // วาด Player
      drawCharacter(ctx, player.x, player.y, player.radius, player.skinColor, player.shirtColor);
    }

    // --- ระบบโต้ตอบ (Dialogue System) ---
    function startDialogue(npc) {
      gameState = 'dialogue';
      document.getElementById('dialogueBox').style.display = 'block';
      document.getElementById('npcName').textContent = npc.name;
      
      if (npc.completed) {
        document.getElementById('npcText').textContent = "ขอบใจมากนะที่ช่วยแก้ปัญหาให้! ตอนนี้บอททำงานเนี๊ยบเลยล่ะ";
        document.getElementById('choicesContainer').innerHTML = `<button class="choice-btn" onclick="endDialogue()">[ ปิดหน้าต่าง ]</button>`;
      } else {
        document.getElementById('npcText').textContent = npc.text;
        
        let choicesHTML = '';
        npc.choices.forEach((choice, index) => {
          choicesHTML += `<button class="choice-btn" onclick="selectChoice('${npc.name}', ${index})">${choice.text}</button>`;
        });
        document.getElementById('choicesContainer').innerHTML = choicesHTML;
      }
    }

    function selectChoice(npcName, choiceIndex) {
      const npc = npcs.find(n => n.name === npcName);
      const choice = npc.choices[choiceIndex];
      
      document.getElementById('npcText').textContent = choice.reply;
      document.getElementById('choicesContainer').innerHTML = `<button class="choice-btn" onclick="endDialogue()">[ ถัดไป ]</button>`;
      
      if (choice.correct) {
        npc.completed = true;
        window.Utils.showToast('✅ ตอบถูกต้อง! ได้รับ EXP +50');
        checkAllCompleted();
      } else {
        window.Utils.showToast('❌ ยังไม่ถูก ลองคิดดูใหม่นะ', 'error');
      }
    }

    function endDialogue() {
      document.getElementById('dialogueBox').style.display = 'none';
      // หน่วงเวลาเล็กน้อยกันการกดปุ่มรัว
      setTimeout(() => { gameState = 'playing'; }, 100);
    }

    function checkAllCompleted() {
      const allDone = npcs.every(n => n.completed);
      if (allDone) {
        setTimeout(() => {
          window.Utils.confetti();
          window.Utils.showToast('🎉 ยินดีด้วย! คุณช่วยชาวเมืองแก้ไขบอทสำเร็จครบทุกคนแล้ว!', 'success');
          
          let prog = window.Utils.Storage.get('cb_progress') || {};
          prog.games = { ...prog.games, rpg: true };
          window.Utils.Storage.set('cb_progress', prog);
          
          if(window.Utils.syncToGoogleSheet) window.Utils.syncToGoogleSheet('มินิเกม (เคลียร์ RPG)');
        }, 1000);
      }
    }

  </script>
</body>
</html>
